name: Gold Replay Gate

on:
  pull_request:
    paths:
      - "Services/Extraction/**"
      - "Utilities/**"
      - "OnDueTests/**"
      - "OnDue.xcodeproj/**"
      - ".github/workflows/gold-replay-gate.yml"
  push:
    branches:
      - main
    paths:
      - "Services/Extraction/**"
      - "Utilities/**"
      - "OnDueTests/**"
      - "OnDue.xcodeproj/**"
      - ".github/workflows/gold-replay-gate.yml"

jobs:
  replay-gate:
    name: Replay Gate
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_NAME="$(python3 - <<'PY'
          import re
          import subprocess

          out = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available"],
              text=True,
          )
          preferred = ("iPhone 17", "iPhone 16", "iPhone 15", "iPhone 14")
          selected_name = None

          lines = out.splitlines()
          for model in preferred:
              for line in lines:
                  if model not in line:
                      continue
                  if re.search(r"\(([0-9A-F-]{36})\)", line):
                      selected_name = model
                      break
              if selected_name:
                  break

          if not selected_name:
              for line in lines:
                  if "iPhone" not in line:
                      continue
                  m = re.search(r"\s*(iPhone[^()]+)\s+\([0-9A-F-]{36}\)", line)
                  if m:
                      selected_name = m.group(1).strip()
                      break

          if not selected_name:
              raise SystemExit("No available iPhone simulator found.")

          print(selected_name)
          PY
          )"
          echo "simulator_name=${SIMULATOR_NAME}" >> "$GITHUB_OUTPUT"

      - name: Run strict gold replay gate
        shell: bash
        run: |
          set -euo pipefail
          echo "Using simulator: ${{ steps.simulator.outputs.simulator_name }}"
          xcodebuild test \
            -project "OnDue.xcodeproj" \
            -scheme "OnDue" \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.simulator_name }},OS=latest" \
            -only-testing:"OnDueTests/PolicyReplayHarnessTests/testGoldDatasetV1ReplayGateHasNoHardFailures"
